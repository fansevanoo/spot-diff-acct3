<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Night Market — Spot the Difference</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #17102a;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
  }
  #wrap {
    width: min(1280px, 100vw);
    padding: 8px;
    box-sizing: border-box;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    cursor: crosshair;
    box-shadow: 0 0 60px rgba(247, 201, 72, 0.12), 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  p {
    color: #8a7aa8;
    font-family: sans-serif;
    font-size: 13px;
    text-align: center;
    margin: 8px 0 0;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="800"></canvas>
    <p>Lantern Night Market — five lantern-lit scenes, ten differences each. Find them all before the lanterns burn down.</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
